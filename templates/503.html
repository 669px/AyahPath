<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>503 — Service Unavailable | AyahPath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
  </head>
  <body class="bg-sacred-gradient">
    <main class="error">
      <section class="error-panel">
        <p class="error-code">503</p>
        <h1 class="error-title">Service unavailable</h1>
        <p class="error-desc">
          We're temporarily offline for maintenance or under heavy load. Please try again soon.
        </p>
        <p class="error-desc text-ar" dir="rtl">
          الخدمة غير متاحة مؤقتًا. حاول مرة أخرى قريبًا.
        </p>
        <div class="error-actions">
          <a class="btn btn-primary" href="/">Go home</a>
          <a class="btn" href="javascript:location.reload()">Try again</a>
        </div>
      </section>
    </main>
  </body>
</html>
